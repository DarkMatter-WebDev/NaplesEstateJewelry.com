[build]
  base    = "next-app"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # 22 (2026-09-14): @netlify/plugin-nextjs already refused Node 20.20.2 and ran
  # itself on 22.x, so the app build and the runtime plugin used different
  # Node versions. One version everywhere Netlify runs. Local dev is Node 24.
  NODE_VERSION = "22"
  # PAYPAL_CLIENT_ID is public by design — it ships to the browser inside the
  # PayPal JS SDK URL (so it appears in checkout HTML/RSC). It is NOT the secret;
  # PAYPAL_CLIENT_SECRET stays server-side and must never be added here.
  # PAYPAL_ENV and EBAY_ENV are not secrets either — their only values are
  # "sandbox"/"live" and "sandbox"/"production" respectively (see
  # next-app/src/lib/paypal.ts and next-app/src/lib/ebay/client.ts). The
  # scanner flags them because those generic words appear as literal strings
  # throughout the build output (e.g. Next.js's own NODE_ENV==="production"
  # checks baked into every chunk) — same false-positive, same fix.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,PAYPAL_CLIENT_ID,PAYPAL_ENV,EBAY_ENV"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# ✅ DEPLOY GATE SATISFIED (2026-08-01 domain switch to naplesestatejewelry.com):
# the .com is LIVE on this Netlify site — GoDaddy DNS A @ and www → 75.2.60.5
# (re-verified 2026-09-21; www no longer CNAMEs to a *.netlify.app name, so the
# 2026-09-20 project rename naplesantiques → naplesestatejewelry changed
# nothing), apex + www added as domains, .com set as PRIMARY, Let's Encrypt
# cert covering all four NEJ hosts, and https://naplesestatejewelry.com
# verified serving in a browser. The host redirects below are safe to deploy.
#
# naplesantiquesllc.com is NOT on this project any more (2026-09-20): it is
# the primary domain of the separate Naples Antiques and Estate Services site,
# which 301s NEJ's old paths back here itself. Its host redirects that lived
# here were removed 2026-09-21 — never re-add them (SEO_LEAD_AUDIT.md).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Domain switch (2026-08-01): naplesestatejewelry.co → naplesestatejewelry.com.
# The .co stays a Netlify domain alias so these path-preserving 301s transfer
# its index equity and keep old links working. Email stays on the .co domain
# (info@/chris@/noreply@naplesestatejewelry.co) — DNS MX records for .co must
# never be touched by this migration.
#
# The /api/* carve-out serves API calls on the .co host directly (no redirect)
# because external services still POST to .co endpoints until they are
# re-registered on .com: the PayPal webhook, the eBay account-deletion
# endpoint, and the Etsy/eBay OAuth callbacks. Webhook POSTs do not follow
# 301s. Remove the carve-out only after every integration is re-registered
# on .com (tracked in project-docs/TASKS.md).
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://naplesestatejewelry.co/api/*"
  to = "/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://naplesestatejewelry.co/*"
  to = "https://naplesestatejewelry.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://naplesestatejewelry.co/*"
  to = "https://naplesestatejewelry.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.naplesestatejewelry.co/*"
  to = "https://naplesestatejewelry.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.naplesestatejewelry.co/*"
  to = "https://naplesestatejewelry.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Bot / scanner hardening — the narrowly scoped
# next-app/netlify/edge-functions/blocked-probes.ts handler returns 410 before
# framework routing or redirects run. Keep these forced redirects as a
# defense-in-depth fallback for platforms/builds that do not execute the edge
# handler.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/wp-admin/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/.env*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/config.json"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/410.html"
  status = 410
  force = true

# ---------------------------------------------------------------------------
# Security headers (applied to every response). The Content-Security-Policy is
# deployed in Report-Only mode first so violations are logged but nothing is
# blocked; promote it to Content-Security-Policy once the browser console /
# report endpoint is clean.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # microphone=(self): the admin listing assistant's tap-to-talk. Mirror of next.config.ts.
    Permissions-Policy = "geolocation=(), microphone=(self), camera=()"
    # Enforcing CSP. Allowlist covers all third parties in use: Supabase (data/images),
    # gold-api.com (spot prices), Google Fonts, TradingView embed widgets (service-page
    # price charts), PayPal (checkout SDK/iframe), and Cloudflare Turnstile
    # (challenges.cloudflare.com — Supabase Auth CAPTCHA; must stay in sync with
    # next-app/next.config.ts, the same two-file rule as the Google Maps embed). ⚠️ If a page breaks after deploy,
    # roll back instantly by re-commenting this line and uncommenting the Report-Only
    # line below. Verify after deploy: home, /gold-services (TradingView chart), and
    # /checkout (PayPal — once its Netlify creds are fixed).
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://evzluixourmsefwdsieu.supabase.co https://s3.tradingview.com https://*.tradingview.com https://*.paypal.com https://*.paypalobjects.com https://*.cloudflarestream.com https://*.videodelivery.net; script-src 'self' 'unsafe-inline' https://s3.tradingview.com https://www.paypal.com https://*.paypalobjects.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://evzluixourmsefwdsieu.supabase.co https://api.gold-api.com https://s3.tradingview.com https://*.tradingview.com https://*.tradingview-widget.com https://*.paypal.com https://*.cloudflarestream.com https://*.videodelivery.net; frame-src https://*.tradingview.com https://*.tradingview-widget.com https://*.paypal.com https://*.cloudflarestream.com https://*.videodelivery.net https://www.google.com https://maps.google.com https://challenges.cloudflare.com; media-src 'self' blob: https://*.cloudflarestream.com https://*.videodelivery.net; worker-src 'self' blob:"
    X-Permitted-Cross-Domain-Policies = "none"
    # Rollback line (uncomment this and comment the line above to revert to report-only):
    # Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data: https://evzluixourmsefwdsieu.supabase.co; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://evzluixourmsefwdsieu.supabase.co https://api.gold-api.com; frame-ancestors 'none'"

# ---------------------------------------------------------------------------
# Caching — short, revalidated cache for HTML; immutable long cache for
# fingerprinted/static assets. Netlify applies LATER matching rules with
# precedence, so the /* catch-all must come FIRST and the specific asset rules
# after it — otherwise the catch-all's max-age=0 clobbers the immutable rules
# on /assets/* and /_next/static/*.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

